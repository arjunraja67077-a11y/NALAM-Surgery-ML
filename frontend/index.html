<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NALAM Hospital - Surgery ML</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><header><h1>NALAM HOSPITAL</h1><p>Surgery Machine Learning Prediction System</p></header>
<form id="predictionForm"><section><h2>Patient Details</h2><div class="grid"><label>Age<input id="age" type="number" min="1" max="120" required></label><label>Gender<select id="gender"><option>Male</option><option>Female</option><option>Other</option></select></label><label>Primary Complaint<input id="complaint" required></label><label>Problem / Disease<input id="disease" required></label></div></section>
<section><h2>Surgery Details</h2><div class="grid"><label>Diagnosis<input id="diagnosis" required></label><label>Investigation<input id="investigation" required></label><label>Surgery Name<input id="surgery" required></label><label>Surgery Type<select id="surgery_type"><option>Elective</option><option>Emergency</option></select></label><label>Anaesthesia<input id="anaesthesia" value="General"></label><label>Medical History<input id="history"></label></div></section><button type="submit">PREDICT</button></form><div id="result" class="result hidden"></div></main><script src="script.js"></script></body></html>
